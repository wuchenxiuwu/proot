name: Build Mesa Panfrost for Termux

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesa
        uses: actions/checkout@v4
        with:
          repository: mesa/mesa
          ref: main  # 或指定稳定分支
          path: mesa

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build python3 python3-pip pkg-config \
            libdrm-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev \
            libxshmfence-dev libxcb1-dev libwayland-dev wayland-protocols \
            libunwind-dev libzstd-dev libelf-dev llvm-dev

      - name: Configure Mesa for Android (ARM64)
        run: |
          cd mesa
          meson build-android \
            -D platforms=drm \
            -D gallium-drivers=panfrost \
            -D vulkan-drivers=panfrost \
            -D gallium-opencl=rusticl \
            -D opencl-spirv=true \
            -D llvm=enabled \
            -D libunwind=enabled \
            -D prefix=/data/data/com.termux/files/usr \
            -D libdir=lib

      - name: Compile Mesa
        run: |
          cd mesa
          ninja -C build-android

      - name: Package artifacts
        run: |
          mkdir -p artifacts/lib
          cp mesa/build-android/src/gallium/targets/panfrost/libpanfrost.so artifacts/lib/
          cp mesa/build-android/src/gallium/targets/opencl/libMesaOpenCL.so artifacts/lib/
          cp mesa/build-android/src/vulkan/panfrost/libvulkan_panfrost.so artifacts/lib/
          mkdir -p artifacts/share/vulkan/icd.d
          cat > artifacts/share/vulkan/icd.d/panfrost_icd.json << EOF
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "/data/data/com.termux/files/usr/lib/libvulkan_panfrost.so",
              "api_version": "1.3.0"
            }
          }
          EOF
          mkdir -p artifacts/etc/OpenCL/vendors
          echo "/data/data/com.termux/files/usr/lib/libMesaOpenCL.so" > artifacts/etc/OpenCL/vendors/mesa.icd
          tar -czf mesa-panfrost-android.tar.gz -C artifacts .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-panfrost-android
          path: mesa-panfrost-android.tar.gz
