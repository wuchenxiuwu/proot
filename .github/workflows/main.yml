name: Build Mesa Panfrost for Termux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesa
        uses: actions/checkout@v4
        with:
          repository: mesa/mesa
          ref: main
          path: mesa

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build pkg-config \
            libzstd-dev libelf-dev llvm-dev libdrm-dev python3-mako \
            bison flex gettext

      - name: Setup Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          unzip android-ndk-r23c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r23c" >> $GITHUB_ENV
          echo "PATH=$PWD/android-ndk-r23c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      - name: Create cross file for Android aarch64
        run: |
          cat > android-aarch64.txt << EOF
          [binaries]
          c = 'aarch64-linux-android29-clang'
          cpp = 'aarch64-linux-android29-clang++'
          ar = 'llvm-ar'
          ld = 'ld.lld'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          c_args = ['-D__ANDROID_API__=29', '-fPIC', '-I/usr/include']
          cpp_args = ['-D__ANDROID_API__=29', '-fPIC', '-I/usr/include']
          c_link_args = ['-static-libstdc++', '-Wl,--allow-shlib-undefined']
          cpp_link_args = ['-static-libstdc++', '-Wl,--allow-shlib-undefined']

          [built-in options]
          prefix = '/data/data/com.termux/files/usr'
          libdir = 'lib'
          EOF

      - name: Configure Mesa with meson
        run: |
          meson setup --cross-file=$GITHUB_WORKSPACE/android-aarch64.txt \
            -D platforms=drm \
            -D gallium-drivers=panfrost \
            -D vulkan-drivers=panfrost \
            -D gallium-opencl=rusticl \
            -D opencl-spirv=true \
            -D llvm=enabled \
            -D libunwind=disabled \
            -D zstd=enabled \
            -D glvnd=false \
            -D shared-glapi=enabled \
            -D gles1=disabled \
            -D gles2=enabled \
            -D opengl=false \
            build-android mesa

      - name: Compile Mesa
        run: |
          ninja -C build-android

      - name: Package artifacts
        run: |
          mkdir -p artifacts/lib
          # 复制生成的共享库
          cp build-android/src/gallium/targets/panfrost/libpanfrost.so artifacts/lib/ 2>/dev/null || true
          cp build-android/src/gallium/targets/opencl/libMesaOpenCL.so artifacts/lib/ 2>/dev/null || true
          cp build-android/src/vulkan/panfrost/libvulkan_panfrost.so artifacts/lib/ 2>/dev/null || true

          # 创建 ICD 配置
          mkdir -p artifacts/share/vulkan/icd.d
          cat > artifacts/share/vulkan/icd.d/panfrost_icd.json << EOF
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "/data/data/com.termux/files/usr/lib/libvulkan_panfrost.so",
              "api_version": "1.3.0"
            }
          }
          EOF

          mkdir -p artifacts/etc/OpenCL/vendors
          echo "/data/data/com.termux/files/usr/lib/libMesaOpenCL.so" > artifacts/etc/OpenCL/vendors/mesa.icd

          tar -czf mesa-panfrost-android.tar.gz -C artifacts .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-panfrost-android
          path: mesa-panfrost-android.tar.gz
